<footer class="statusbar" role="contentinfo" aria-label="Statusleiste">
  <div class="statusbar__group">
    <span class="item" aria-label="Git-Branch: main">
      <mat-icon class="icon" fontIcon="call_split" aria-hidden="true"></mat-icon>
      main
    </span>
    <span class="item" aria-label="0 Commits voraus, 0 Commits hinten">
      <mat-icon class="icon" fontIcon="sync" aria-hidden="true"></mat-icon>
      0 &uarr; 0 &darr;
    </span>
    <span class="item" aria-label="0 Fehler, 0 Warnungen">
      <mat-icon class="icon icon--error" fontIcon="error" aria-hidden="true"></mat-icon>
      0
      <mat-icon class="icon icon--warn" fontIcon="warning" aria-hidden="true"></mat-icon>
      0
    </span>
  </div>

  <div class="statusbar__group">
    <span class="item">Ln 1, Col 1</span>
    <span class="item">Spaces: 2</span>
    <span class="item">UTF-8</span>
    <span class="item">LF</span>
    <span class="item">
      <mat-icon class="icon" fontIcon="code" aria-hidden="true"></mat-icon>
      TypeScript
    </span>
    <button
      type="button"
      class="item item--toggle"
      (click)="toggleLang()"
      [title]="t().toggle.title"
      [attr.aria-label]="t().toggle.title + ' (aktuell: ' + t().toggle.label + ')'"
    >
      <mat-icon class="icon" fontIcon="translate" aria-hidden="true"></mat-icon>
      {{ t().toggle.label }}
    </button>
    <span class="item" aria-hidden="true">
      <mat-icon class="icon" fontIcon="notifications"></mat-icon>
    </span>
  </div>
</footer>
