<section class="hero">
  <div class="hero__glow hero__glow--a" aria-hidden="true"></div>
  <div class="hero__glow hero__glow--b" aria-hidden="true"></div>

  <div class="hero__inner">
    <div class="hero__text">
      <p class="hero__eyebrow">
        <span class="hero__eyebrow-comment">//</span>
        {{ t().eyebrow }}
      </p>

      <h1 class="hero__title" id="readme-title">
        {{ t().greeting }} <span class="hero__name">{{ name }}</span>
        <span class="hero__wave" aria-hidden="true">👋</span>
      </h1>

      <p class="hero__lead" [innerHTML]="t().lead"></p>

      <div class="hero__ctas">
        <a class="btn btn--primary" href="#contact" (click)="scrollTo($event, 'contact')">
          <span>{{ t().ctaPrimary }}</span>
          <mat-icon class="btn__icon" fontIcon="arrow_forward"></mat-icon>
        </a>
        <a class="btn btn--ghost" href="#projects" (click)="scrollTo($event, 'projects')">
          <mat-icon class="btn__icon" fontIcon="folder_open"></mat-icon>
          <span>{{ t().ctaSecondary }}</span>
        </a>
      </div>

      <ul class="hero__socials">
        @for (social of socials; track social.label) {
          <li>
            <a [href]="social.href" target="_blank" rel="noopener">
              <mat-icon [fontIcon]="social.icon"></mat-icon>
              <span>{{ social.label }}</span>
            </a>
          </li>
        }
      </ul>
    </div>

    <div class="hero__portrait">
      <div class="hero__portrait-ring" aria-hidden="true"></div>
      <img
        class="hero__photo"
        [src]="photo"
        [alt]="'Portr&auml;tfoto von ' + name"
        width="380"
        height="380"
        fetchpriority="high"
        decoding="async"
        (error)="onImageError($event)"
      />
    </div>
  </div>

  <a class="hero__scroll" href="#about" aria-label="Scroll" (click)="scrollTo($event, 'about')">
    <mat-icon fontIcon="keyboard_arrow_down"></mat-icon>
  </a>
</section>
