<div class="skills">
  <header class="skills__header">
    <p class="skills__eyebrow">
      <span class="skills__comment">//</span> skills.json
    </p>
    <h2 class="skills__title" id="skills-title">{{ t().title }}</h2>
    <p class="skills__lead">{{ t().lead }}</p>
  </header>

  <div class="skills__grid">
    <aside class="photo-card">
      <div class="photo-card__head">
        <span class="photo-card__dot photo-card__dot--r"></span>
        <span class="photo-card__dot photo-card__dot--y"></span>
        <span class="photo-card__dot photo-card__dot--g"></span>
        <span class="photo-card__file">profil-img-two.jpg</span>
      </div>
      <img class="photo-card__img" [src]="photo" alt="Phillip Schuster" />
      <div class="photo-card__foot">
        <span class="photo-card__ln">1</span>
        <span class="photo-card__cm">{{ t().photoCaption }}</span>
      </div>
    </aside>

    <ul class="chips">
      @for (skill of skills; track skill.name) {
        <li class="chip">
          <div class="chip__icon">
            <img [src]="skill.image" [alt]="skill.name" loading="lazy" />
          </div>
          <span class="chip__name">{{ skill.name }}</span>
        </li>
      }
    </ul>
  </div>
</div>
